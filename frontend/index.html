<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/plato_mark_black.svg" />
    <!--
      Prompt — Google Fonts. Cadson Demak's geometric sans, used as the
      single typeface across the whole site. Weights 300 (default for
      headlines and body), 400 (UI controls and emphasis), 500 (active
      states and stronger emphasis). preconnect avoids a serial DNS+TLS
      hop on first paint.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <title>plato — AI investment dialogues</title>
    <meta
      name="description"
      content="Structured Socratic debates between AI personas for asset managers and enterprise risk practitioners."
    />
  </head>
  <body class="bg-bg text-ink">
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
