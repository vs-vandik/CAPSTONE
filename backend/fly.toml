# fly.toml app configuration file for plato-capstone.
#
# See https://fly.io/docs/reference/configuration/ for the full reference.

app = "plato-capstone"
primary_region = "fra"

[build]

[env]
  # The frontend production origin (Vercel) is set as a *secret* via
  #   flyctl secrets set CORS_ORIGINS="..."
  # rather than hardcoded here, so it can change without a deploy. This
  # `[env]` value is the local-dev fallback and is overridden by the
  # secret at runtime.
  CORS_ORIGINS = "http://localhost:5173,http://localhost:3000"
  # Also allow Vercel production/preview origins for demo builds. The
  # frontend calls the Fly API directly in production unless VITE_API_BASE
  # overrides it, so the browser needs CORS to succeed from vercel.app.
  CORS_ORIGIN_REGEX = "https://[a-z0-9-]+\\.vercel\\.app"

[http_service]
  internal_port = 8000
  force_https = true
  # Sessions live in process memory (see app/api/routes.py). Two
  # consequences for Fly's autoscaler:
  #
  # 1. We must run exactly ONE machine. With two, requests from the
  #    same browser can hit different machines on Fly's load balancer,
  #    and the second machine doesn't know about the session created
  #    on the first -> "Session not found". The current scale is set
  #    via `flyctl scale count 1`; do NOT recreate a second machine
  #    via `flyctl machine clone`.
  #
  # 2. We cannot let the machine auto-stop on idle, because restart
  #    wipes every active session. `auto_stop_machines = false` keeps
  #    the machine warm 24/7. `min_machines_running = 1` alone does
  #    not prevent auto-stop on Fly's machines platform — they're
  #    independent settings, and previously setting only the latter
  #    silently let sessions evaporate when traffic went idle.
  #
  # Cost: a few cents per day of running cost on shared-cpu-1x/512MB.
  # Accepted trade-off for the capstone demo. Sessions still die on
  # every deploy / OOM kill — also accepted. Real persistence (Redis
  # etc.) is deliberately out of scope.
  #
  # Concurrent users on one machine: each blocking LLM call now runs
  # in starlette's threadpool (default 40 threads) rather than on the
  # event loop, so 40 concurrent in-flight LLM calls is the ceiling.
  # See the async-vs-sync note in app/api/routes.py.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 20
    hard_limit = 25

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
